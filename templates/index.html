<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudyLens</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      margin: 0;
      padding: 30px 15px;
      color: #1f2937;
    }
    .container { max-width: 750px; margin: auto; }
    h1 { margin-bottom: 4px; }
    .subtitle { color: #6b7280; margin-top: 0; }
    .card {
      background: white;
      border-radius: 10px;
      padding: 20px;
      margin-top: 20px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    h2 { margin-top: 0; font-size: 18px; }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      margin-bottom: 10px;
    }
    select {
      width: 100%;
      padding: 8px;
      font-size: 15px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    .danger { background: #b91c1c; margin-top: 10px; }
    .danger:hover { background: #991b1b; }
    .status { margin-top: 10px; font-size: 14px; }
    .ok { color: #15803d; }
    .error { color: #b91c1c; }
    .answer { font-size: 22px; font-weight: bold; margin: 5px 0 10px; }
    .meta { color: #4b5563; font-size: 14px; margin-bottom: 10px; }
    .context {
      background: #f9fafb;
      border-left: 4px solid #2563eb;
      padding: 10px;
      font-size: 14px;
      color: #374151;
    }
    .hidden { display: none; }
    .divider { border: none; border-top: 1px solid #e5e7eb; margin: 20px 0; }

    .bar-row { margin: 12px 0; }
    .bar-label { font-size: 14px; margin-bottom: 3px; }
    .bar-track { background: #e5e7eb; border-radius: 6px; height: 14px; }
    .bar-fill { background: #2563eb; height: 14px; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>StudyLens</h1>
    <p class="subtitle">Upload a PDF and ask questions about it.</p>

    <!-- Step 1: upload + document list -->
    <div class="card">
      <h2>1. Upload your PDF</h2>
      <input type="file" id="pdfFile" accept=".pdf">
      <br><br>
      <button id="uploadBtn">Upload</button>
      <div id="uploadStatus" class="status"></div>

      <hr class="divider">

      <p style="margin-top:0; margin-bottom:5px;"><b>Your documents:</b></p>
      <select id="docSelect"></select>
      <button id="deleteBtn" class="danger">Delete selected</button>
    </div>

    <!-- Step 2: ask -->
    <div class="card">
      <h2>2. Ask a question</h2>
      <input type="text" id="question" placeholder="e.g. What technologies were used?">
      <button id="askBtn">Ask</button>
      <div id="askStatus" class="status"></div>
    </div>

    <!-- Step 3: insights -->
    <div class="card">
      <h2>3. Document insights</h2>
      <button id="insightsBtn">Get insights</button>
      <div id="insightsStatus" class="status"></div>
      <div id="insightsBox" class="hidden">
        <p><b>Keywords:</b> <span id="kw"></span></p>
        <p><b>Summary:</b></p>
        <ul id="sum"></ul>
        <p><b>Key terms:</b></p>
        <div id="ents"></div>
      </div>
    </div>

    <!-- Step 4: topics -->
    <div class="card">
      <h2>4. Topics in your document</h2>
      <button id="topicsBtn">Find topics</button>
      <div id="topicsStatus" class="status"></div>
      <div id="topicsBox"></div>
    </div>

    <!-- Answer -->
    <div class="card hidden" id="answerCard">
      <h2>Answer</h2>
      <div class="answer" id="answerText"></div>
      <div class="meta" id="answerMeta"></div>
      <div class="context" id="answerContext"></div>
    </div>
  </div>

  <script>
    const uploadBtn = document.getElementById("uploadBtn");
    const askBtn = document.getElementById("askBtn");
    const uploadStatus = document.getElementById("uploadStatus");
    const askStatus = document.getElementById("askStatus");
    const answerCard = document.getElementById("answerCard");

    function setStatus(element, message, type) {
      element.textContent = message;
      element.className = "status " + type;
    }

    // ---------- Document list ----------
    const docSelect = document.getElementById("docSelect");
    const deleteBtn = document.getElementById("deleteBtn");

    async function loadDocuments(selectId) {
      try {
        const res = await fetch("/documents");
        const docs = await res.json();
        docSelect.innerHTML = "";
        docs.forEach(d => {
          const opt = document.createElement("option");
          opt.value = d.id;
          opt.textContent = d.filename + " (" + d.pages + " pages)";
          docSelect.appendChild(opt);
        });
        if (selectId) docSelect.value = selectId;
      } catch (err) {
        console.error("Could not load documents", err);
      }
    }

    function currentDocId() {
      return docSelect.value;
    }

    deleteBtn.addEventListener("click", async () => {
      const id = currentDocId();
      if (!id) return;
      if (!confirm("Delete this document?")) return;
      await fetch("/documents/" + id, { method: "DELETE" });
      loadDocuments();
    });

    loadDocuments();

    // ---------- Upload ----------
    uploadBtn.addEventListener("click", async () => {
      const file = document.getElementById("pdfFile").files[0];
      if (!file) {
        setStatus(uploadStatus, "Please choose a PDF first.", "error");
        return;
      }

      const formData = new FormData();
      formData.append("file", file);

      uploadBtn.disabled = true;
      setStatus(uploadStatus, "Uploading and processing... please wait.", "");

      try {
        const response = await fetch("/upload", { method: "POST", body: formData });
        const data = await response.json();

        if (response.ok) {
          setStatus(uploadStatus,
            "Done! " + data.filename + ": " + data.pages + " pages, " + data.chunks + " chunks.",
            "ok");
          await loadDocuments(data.id);

          try {
            const r = await fetch("/doc-type?doc_id=" + data.id);
            if (r.ok) {
              const d = await r.json();
              uploadStatus.textContent += "  Document type: " + d.type +
                " (" + Math.round(d.confidence * 100) + "% sure)";
            }
          } catch (e) {}

        } else {
          setStatus(uploadStatus, data.detail || "Upload failed.", "error");
        }
      } catch (err) {
        setStatus(uploadStatus, "Could not reach the server.", "error");
      }
      uploadBtn.disabled = false;
    });

    // ---------- Ask ----------
    async function askQuestion() {
      const question = document.getElementById("question").value.trim();
      if (!question) {
        setStatus(askStatus, "Please type a question.", "error");
        return;
      }
      if (!currentDocId()) {
        setStatus(askStatus, "Please upload or select a document first.", "error");
        return;
      }

      askBtn.disabled = true;
      answerCard.classList.add("hidden");
      setStatus(askStatus, "Thinking...", "");

      try {
        const response = await fetch(
          "/ask?question=" + encodeURIComponent(question) + "&doc_id=" + currentDocId()
        );
        const data = await response.json();

        if (!response.ok) {
          setStatus(askStatus, data.detail || "Something went wrong.", "error");
        } else {
          setStatus(askStatus, "", "");
          document.getElementById("answerText").textContent = data.answer;

          let meta = "Source: Page " + data.page +
                     "  |  Confidence: " + Math.round(data.confidence * 100) + "%";
          if (data.confidence < 0.1) {
            meta += "  |  Low confidence: this may not be in your document.";
          }
          document.getElementById("answerMeta").textContent = meta;
          document.getElementById("answerContext").textContent = data.context;
          answerCard.classList.remove("hidden");
        }
      } catch (err) {
        setStatus(askStatus, "Could not reach the server.", "error");
      }
      askBtn.disabled = false;
    }

    askBtn.addEventListener("click", askQuestion);
    document.getElementById("question").addEventListener("keydown", (e) => {
      if (e.key === "Enter") askQuestion();
    });

    // ---------- Insights ----------
    const insightsBtn = document.getElementById("insightsBtn");
    const insightsStatus = document.getElementById("insightsStatus");

    insightsBtn.addEventListener("click", async () => {
      if (!currentDocId()) {
        setStatus(insightsStatus, "Please upload or select a document first.", "error");
        return;
      }

      insightsBtn.disabled = true;
      setStatus(insightsStatus, "Analysing... please wait.", "");
      try {
        const response = await fetch("/insights?doc_id=" + currentDocId());
        const data = await response.json();
        if (!response.ok) {
          setStatus(insightsStatus, data.detail || "Something went wrong.", "error");
        } else {
          setStatus(insightsStatus, "", "");
          document.getElementById("kw").textContent = data.keywords.join(", ");

          const list = document.getElementById("sum");
          list.innerHTML = "";
          data.summary.forEach(s => {
            const li = document.createElement("li");
            li.textContent = s.text + " (page " + s.page + ")";
            list.appendChild(li);
          });

          const ents = document.getElementById("ents");
          ents.innerHTML = "";
          const names = { PERSON: "People", ORG: "Organisations", GPE: "Places", DATE: "Dates" };
          for (const label in data.entities) {
            const p = document.createElement("p");
            p.textContent = (names[label] || label) + ": " + data.entities[label].join(", ");
            ents.appendChild(p);
          }
          document.getElementById("insightsBox").classList.remove("hidden");
        }
      } catch (err) {
        setStatus(insightsStatus, "Could not reach the server.", "error");
      }
      insightsBtn.disabled = false;
    });

    // ---------- Topics ----------
    const topicsBtn = document.getElementById("topicsBtn");
    const topicsStatus = document.getElementById("topicsStatus");

    topicsBtn.addEventListener("click", async () => {
      if (!currentDocId()) {
        setStatus(topicsStatus, "Please upload or select a document first.", "error");
        return;
      }

      topicsBtn.disabled = true;
      setStatus(topicsStatus, "Finding topics...", "");
      try {
        const response = await fetch("/topics?doc_id=" + currentDocId());
        const data = await response.json();
        const box = document.getElementById("topicsBox");
        box.innerHTML = "";

        if (!response.ok) {
          setStatus(topicsStatus, data.detail || "Something went wrong.", "error");
        } else if (data.length === 0) {
          setStatus(topicsStatus, "This document is too short to find topics.", "error");
        } else {
          setStatus(topicsStatus, "", "");
          const biggest = Math.max(...data.map(t => t.size));
          data.forEach(t => {
            const row = document.createElement("div");
            row.className = "bar-row";

            const label = document.createElement("div");
            label.className = "bar-label";
            label.textContent = t.keywords.join(", ") + "  (" + t.size +
              " chunks, pages " + t.pages.slice(0, 8).join(", ") +
              (t.pages.length > 8 ? "..." : "") + ")";

            const track = document.createElement("div");
            track.className = "bar-track";
            const fill = document.createElement("div");
            fill.className = "bar-fill";
            fill.style.width = (t.size / biggest * 100) + "%";

            track.appendChild(fill);
            row.appendChild(label);
            row.appendChild(track);
            box.appendChild(row);
          });
        }
      } catch (err) {
        setStatus(topicsStatus, "Could not reach the server.", "error");
      }
      topicsBtn.disabled = false;
    });
  </script>
</body>
</html>
